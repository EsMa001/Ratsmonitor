# Kundenzugang (nur lesend) über HTTPS. Schlüssel vom Betreiber (scripts/mcp-customers.mjs key) in der Umgebungsvariable
# PLENARA_MCP_KEY; ohne Schlüssel meldet sich der Client per OAuth mit dem Plenara-Konto an.
[mcp_servers.plenara]
url = "https://plenara.de/mcp"
bearer_token_env_var = "PLENARA_MCP_KEY"
tool_timeout_sec = 60
