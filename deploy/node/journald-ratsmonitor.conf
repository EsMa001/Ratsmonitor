# Protokolle höchstens 7 Tage (Löschkonzept, requirements/konten-konzept.md 12). Installieren (als root, gilt für den ganzen Server):
#   mkdir -p /etc/systemd/journald.conf.d && cp deploy/node/journald-ratsmonitor.conf /etc/systemd/journald.conf.d/ratsmonitor.conf && systemctl restart systemd-journald
[Journal]
MaxRetentionSec=7day
